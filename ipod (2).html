<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>iPod Classic Retro UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .ipod {
            width: 360px;
            height: 580px;
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 4px solid #d1d1d6;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }
        body.mobile-device .ipod {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            padding: 20px 15px;
        }
        .screen {
            width: 100%;
            height: 200px;
            background: #fff;
            border: 3px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        body.mobile-device .screen {
            height: 40vh;
        }
        .status-bar {
            height: 22px;
            background: linear-gradient(#f0f0f0, #dcdcdc);
            border-bottom: 1px solid #b5b5b5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            font-weight: bold;
            color: #333;
        }
        .battery {
            width: 20px;
            height: 10px;
            border: 1px solid #333;
            position: relative;
            background: #4cd964;
        }
        .battery::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 2px;
            width: 2px;
            height: 4px;
            background: #333;
        }
        .screen-content {
            flex: 1;
            position: relative;
        }
        .view {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }
        .view.active {
            display: flex;
        }
        .menu-title {
            padding: 5px 10px;
            font-weight: bold;
            font-size: 15px;
            background: linear-gradient(#e0e0e0, #c5c5c5);
            border-bottom: 1px solid #b5b5b5;
        }
        .menu-list {
            list-style: none;
            flex: 1;
            overflow-y: auto;
        }
        .menu-item {
            padding: 10px 12px;
            font-size: 14px;
            color: #333;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item.selected {
            background: linear-gradient(#54a0ff, #0052cc);
            color: #fff;
        }
        .menu-item::after {
            content: '>';
            opacity: 0.5;
        }
        .now-playing {
            padding: 20px 15px;
            text-align: center;
            justify-content: space-between;
        }
        .track-title {
            font-weight: bold;
            font-size: 17px;
            color: #111;
            margin-top: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        .progress-container {
            width: 100%;
            background: #e0e0e0;
            height: 12px;
            border-radius: 6px;
            border: 1px solid #b5b5b5;
            overflow: hidden;
            margin-top: auto;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(#54a0ff, #0052cc);
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }
        .click-wheel {
            width: 230px;
            height: 230px;
            background: #f2f2f2;
            border-radius: 50%;
            margin-top: 45px;
            border: 2px solid #d1d1d6;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1), 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }
        body.mobile-device .click-wheel {
            width: 260px;
            height: 260px;
            margin-top: auto;
            margin-bottom: 30px;
        }
        .wheel-btn {
            position: absolute;
            font-weight: bold;
            font-size: 13px;
            color: #8e8e93;
            text-transform: uppercase;
            z-index: 5;
            padding: 15px;
        }
        .btn-menu { top: 5px; left: 50%; transform: translateX(-50%); }
        .btn-next { right: 10px; top: 50%; transform: translateY(-50%); }
        .btn-prev { left: 10px; top: 50%; transform: translateY(-50%); }
        .btn-play { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .center-button {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #fff, #e6e6e6);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #d1d1d6;
            z-index: 10;
        }
        body.mobile-device .center-button {
            width: 90px;
            height: 90px;
        }
        .center-button:active {
            background: #dcdcdc;
        }
        #file-input {
            display: none;
        }
        .editor-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: #fff;
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 15px;
            font-size: 12px;
            overflow-y: auto;
        }
        .editor-panel h3 {
            margin-bottom: 10px;
            text-align: center;
        }
        .editor-panel label {
            margin: 5px 0 2px;
            display: block;
        }
        .editor-panel input {
            width: 100%;
            padding: 5px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .editor-panel button {
            padding: 8px;
            background: #0052cc;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="ipod" id="ipod-body">
        <div class="screen">
            <div class="status-bar">
                <span>iPod</span>
                <span id="play-status">■</span>
                <div class="battery"></div>
            </div>
            <div class="screen-content">
                <div id="view-menu" class="view active">
                    <div class="menu-title">iPod</div>
                    <ul class="menu-list" id="menu-list">
                        <li class="menu-item selected" data-action="now-playing">Nu spelas</li>
                        <li class="menu-item" data-action="upload">Ladda upp låtar (.mp3)</li>
                    </ul>
                </div>
                <div id="view-playing" class="view now-playing">
                    <div class="track-title" id="ui-title">Ingen låt laddad</div>
                    <div class="track-artist" id="ui-artist">Välj Ladda upp i menyn</div>
                    <div class="progress-container">
                        <div class="progress-bar" id="ui-progress"></div>
                    </div>
                    <div class="time-info">
                        <span id="ui-current-time">0:00</span>
                        <span id="ui-duration">0:00</span>
                    </div>
                </div>
                <div class="editor-panel" id="editor">
                    <h3>Skinn-designer</h3>
                    <label>iPod-skal (Färg eller CSS-gradient):</label>
                    <input type="text" id="cfg-body" value="linear-gradient(145deg, #e6e6e6, #ffffff)">
                    <label>Klickhjul-färg:</label>
                    <input type="text" id="cfg-wheel" value="#f2f2f2">
                    <label>Mittknapp-färg:</label>
                    <input type="text" id="cfg-center" value="linear-gradient(145deg, #ffffff, #e6e6e6)">
                    <button id="btn-save-skin">Spara design</button>
                </div>
            </div>
        </div>
        <div class="click-wheel" id="wheel">
            <div class="wheel-btn btn-menu" id="btn-menu">Menu</div>
            <div class="wheel-btn btn-next" id="btn-next">▶▶</div>
            <div class="wheel-btn btn-prev" id="btn-prev">◀◀</div>
            <div class="wheel-btn btn-play" id="btn-play">▶||</div>
            <div class="center-button" id="btn-center"></div>
        </div>
    </div>

    <input type="file" id="file-input" accept="audio/mp3" multiple>
    <audio id="audio-player"></audio>

    <script>
        let currentView = 'menu', menuIndex = 0, playlist = [], currentTrackIndex = 0, menuTimer = null;
        const fileInput = document.getElementById('file-input');
        const audioPlayer = document.getElementById('audio-player');
        const viewMenu = document.getElementById('view-menu');
        const viewPlaying = document.getElementById('view-playing');
        const menuList = document.getElementById('menu-list');
        const uiTitle = document.getElementById('ui-title');
        const uiArtist = document.getElementById('ui-artist');
        const uiProgress = document.getElementById('ui-progress');
        const uiCurrentTime = document.getElementById('ui-current-time');
        const uiDuration = document.getElementById('ui-duration');
        const playStatus = document.getElementById('play-status');
        const ipodBody = document.getElementById('ipod-body');
        const wheel = document.getElementById('wheel');
        const btnCenter = document.getElementById('btn-center');
        const editor = document.getElementById('editor');

        const isMobile = /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
        if (isMobile) { document.body.classList.add('mobile-device'); }

        function vibrate(ms) { if (navigator.vibrate) { navigator.vibrate(ms); } }

        function requestFullscreen() {
            if (isMobile && !document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function saveSkin() {
            const skin = {
                body: document.getElementById('cfg-body').value,
                wheel: document.getElementById('cfg-wheel').value,
                center: document.getElementById('cfg-center').value
            };
            localStorage.setItem('ipod_skin', JSON.stringify(skin));
            applySkin(skin);
            editor.style.display = 'none';
        }

        function applySkin(skin) {
            if (!skin) return;
            ipodBody.style.background = skin.body;
            wheel.style.background = skin.wheel;
            btnCenter.style.background = skin.center;
            document.getElementById('cfg-body').value = skin.body;
            document.getElementById('cfg-wheel').value = skin.wheel;
            document.getElementById('cfg-center').value = skin.center;
        }

        function savePlaylistToStorage() { localStorage.setItem('ipod_playlist', JSON.stringify(playlist)); }
        
        function loadPlaylistFromStorage() {
            const stored = localStorage.getItem('ipod_playlist');
            if (stored) {
                try {
                    playlist = JSON.parse(stored) || [];
                    rebuildMenu();
                } catch (e) {
                    playlist = [];
                }
            }
            const storedSkin = localStorage.getItem('ipod_skin');
            if (storedSkin) {
                try {
                    applySkin(JSON.parse(storedSkin));
                } catch (e) {}
            }
        }

        function rebuildMenu() {
            menuList.innerHTML = `<li class="menu-item" data-action="now-playing">Nu spelas</li><li class="menu-item" data-action="upload">Ladda upp låtar (.mp3)</li>`;
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = 'menu-item';
                li.setAttribute('data-action', 'play-track');
                li.setAttribute('data-index', index);
                li.textContent = track.name;
                menuList.appendChild(li);
            });
            updateMenuVisuals();
        }

        function updateMenuVisuals() {
            const items = menuList.querySelectorAll('.menu-item');
            items.forEach((item, idx) => {
                if (idx === menuIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        wheel.addEventListener('click', (e) => {
            requestFullscreen();
            if (e.target.classList.contains('wheel-btn') || e.target.id === 'btn-center') return;
            vibrate(15);
            if (currentView === 'menu') {
                const items = menuList.querySelectorAll('.menu-item');
                const rect = e.currentTarget.getBoundingClientRect();
                const y = e.clientY - rect.top;
                if (y < rect.height / 2) {
                    menuIndex = (menuIndex - 1 + items.length) % items.length;
                } else {
                    menuIndex = (menuIndex + 1) % items.length;
                }
                updateMenuVisuals();
            }
        });

        function loadTrack(index) {
            if (playlist.length === 0) return;
            currentTrackIndex = index;
            const track = playlist[currentTrackIndex];
            audioPlayer.src = track.url;
            uiTitle.textContent = track.name;
            uiArtist.textContent = 'Spår ' + (currentTrackIndex + 1) + ' av ' + playlist.length;
            audioPlayer.play().catch(() => { playStatus.textContent = '❚❚'; });
            playStatus.textContent = '▶';
        }

        document.getElementById('btn-center').addEventListener('click', () => {
            vibrate(25); requestFullscreen();
            if (currentView === 'menu') {
                const items = menuList.querySelectorAll('.menu-item');
                const selectedItem = items[menuIndex];
                const action = selectedItem.getAttribute('data-action');
                if (action === 'now-playing') {
                    switchView('playing');
                } else if (action === 'upload') {
                    fileInput.click();
                } else if (action === 'play-track') {
                    switchView('playing');
                    loadTrack(parseInt(selectedItem.getAttribute('data-index')));
                }
            }
        });

        const menuBtn = document.getElementById('btn-menu');
        function startMenuHold() { menuTimer = setTimeout(() => { vibrate(50); editor.style.display = 'flex'; }, 3000); }
        function clearMenuHold() { clearTimeout(menuTimer); }

        menuBtn.addEventListener('mousedown', startMenuHold);
        menuBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMenuHold(); });
        menuBtn.addEventListener('mouseup', clearMenuHold);
        menuBtn.addEventListener('mouseleave', clearMenuHold);
        menuBtn.addEventListener('touchend', clearMenuHold);
        
        menuBtn.addEventListener('click', () => {
            vibrate(20); requestFullscreen();
            if (editor.style.display === 'flex') { editor.style.display = 'none'; return; }
            if (currentView === 'playing') switchView('menu');
        });

        document.getElementById('btn-next').addEventListener('click', () => { vibrate(20); if (playlist.length > 0) loadTrack((currentTrackIndex + 1) % playlist.length); });
        document.getElementById('btn-prev').addEventListener('click', () => { vibrate(20); if (playlist.length > 0) loadTrack((currentTrackIndex - 1 + playlist.length) % playlist.length); });
        document.getElementById('btn-play').addEventListener('click', () => { vibrate(20); if (audioPlayer.src) { if (audioPlayer.paused) { audioPlayer.play(); playStatus.textContent = '▶'; } else { audioPlayer.pause(); playStatus.textContent = '❚❚'; } } });
        document.getElementById('btn-save-skin').addEventListener('click', saveSkin);

        function switchView(view) {
            currentView = view;
            if (view === 'menu') {
                viewMenu.classList.add('active');
                viewPlaying.classList.remove('active');
            } else {
                viewMenu.classList.remove('active');
                viewPlaying.classList.add('active');
            }
        }

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            let loadedCount = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    playlist.push({ name: file.name.replace(/\.[^/.]+$/, ""), url: event.target.result });
                    loadedCount++;
                    if (loadedCount === files.length) {
                        savePlaylistToStorage(); rebuildMenu(); switchView('playing');
                        loadTrack(playlist.length - files.length);
                    }
                };
                reader.readAsDataURL(file);
            });
        });

        function formatTime(secs) { if (isNaN(secs)) return "0:00"; const m = Math.floor(secs / 60), s = Math.floor(secs % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
        
        audioPlayer.addEventListener('timeupdate', () => { if (audioPlayer.duration) { uiProgress.style.width = ((audioPlayer.currentTime / audioPlayer.duration) * 100) + '%'; uiCurrentTime.textContent = formatTime(audioPlayer.currentTime); uiDuration.textContent = formatTime(audioPlayer.duration); } });
        audioPlayer.addEventListener('loadedmetadata', () => { uiDuration.textContent = formatTime(audioPlayer.duration); });
        audioPlayer.addEventListener('ended', () => { if (playlist.length > 0 && currentTrackIndex < playlist.length - 1) { loadTrack(currentTrackIndex + 1); } else { playStatus.textContent = '■'; uiProgress.style.width = '0%'; uiCurrentTime.textContent = '0:00'; } });

        window.addEventListener('DOMContentLoaded', loadPlaylistFromStorage);
    </script>
</body>
</html>
